name: bookshop-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes -r requirements-test.txt

      - name: Run tests
        shell: pwsh
        run: .venv\Scripts\python.exe -m pytest -p no:cacheprovider --junitxml=reports/junit.xml

      - name: Migration gate coverage
        shell: pwsh
        run: node openspec/schemas/code-migration/scripts/migration_gate.mjs coverage --root migration-plans/bookshop --change openspec/changes/migrate-bookshop-to-flask

      - name: Migration gate lint
        shell: pwsh
        run: node openspec/schemas/code-migration/scripts/migration_gate.mjs lint --root openspec/changes/migrate-bookshop-to-flask --defs migration-plans/bookshop "*.md" "**/*.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: reports/junit.xml

name: BookShop Windows 检查
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.3'
      - name: 安装固定哈希依赖
        run: python -m pip install --require-hashes -r requirements-test.lock
      - name: BATCH-001 单元测试
        run: python -m unittest tests.test_runtime tests.test_routes.FoundationRouteTests tests.test_delivery.FoundationDeliveryTests
        env:
          BOOKSHOP_VERIFY_ENV: '1'
      # 后续批次通过退出门禁后，将全量 Python／Node 测试接入。

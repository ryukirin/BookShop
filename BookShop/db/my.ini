# 复原环境的 MySQL 服务器设置，用来让旧代码的 SQL 跑起来。
# 不是原配置文件：原服务器的版本、strict 模式、字符集都不知道。
# 依据见 migration-plans/bookshop/legacy-db-reconstruction.md。
# 用 MySQL 8.0.x：8.4 默认禁用、9.x 已移除 mysql_native_password。

[mysqld]
# SQLHelper 连接串：jdbc:mysql://localhost:3310/book
port=3310

# 连接串没有指定 characterEncoding，中文能否正确存取取决于服务器默认字符集。
# 原来是 utf8、utf8mb4 还是 gbk 不知道，这里用 8.0 默认值
character-set-server=utf8mb4
collation-server=utf8mb4_0900_ai_ci

# 8.0 默认值去掉 ONLY_FULL_GROUP_BY。书目查询按 (bname, tname) 分组，
# 又选了没有出现在分组键里的列，开着 ONLY_FULL_GROUP_BY 会报 ERROR 1055。
# 原服务器是关掉了它、用的是 5.6，还是 bname 有唯一约束，不知道。
# STRICT_TRANS_TABLES 是沿用默认值，原来是否开启不知道
sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION

# 旧代码用 Connector/J 8.0.11 和 useSSL=false，并且没有设置 allowPublicKeyRetrieval。
# 账号如果用 8.0 默认的 caching_sha2_password 认证，会报
# "Public Key Retrieval is not allowed"（未用 Java 实测）。这一行要在初始化数据目录之前加上，
# 已有的 root 账号要另外执行：
#   ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '123456';
default_authentication_plugin=mysql_native_password

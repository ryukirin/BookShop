{% extends "layout_admin.html" %}
{% block search %}{% include "_dead_search.html" %}{% endblock %}
{% block content %}
<h1 class="page-header">书籍编辑</h1>
<div class="table-responsive">
<form class="form-signin" name="addbook" method="post" action="admin.action?opttype=editBooks">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% if book %}
<h4>书籍id</h4>
<label for="bid" class="visually-hidden">书籍id</label>
<input type="text" id="bid" name="bid" class="form-control mb-2" readonly placeholder="书籍id" value="{{ book.bid }}">
<label for="publishers" class="visually-hidden">出版社</label>
<input type="text" id="publishers" name="publishers" class="form-control mb-2" placeholder="出版社" maxlength="100" value="{{ book.publishers }}">
<label for="stock" class="visually-hidden">库存</label>
<input type="text" id="stock" name="stock" class="form-control mb-2" placeholder="库存" inputmode="numeric" value="{{ book.stock }}">
<label for="price" class="visually-hidden">售价</label>
<input type="text" id="price" name="price" class="form-control mb-2" placeholder="售价" inputmode="decimal" value="{{ fmt(book.price_cents) }}">
{% endif %}
<button type="submit" class="btn btn-success">提交</button>
</form>
</div>
{% endblock %}

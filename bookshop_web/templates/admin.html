{% extends "layout_admin.html" %}
{% block search %}
<form class="d-flex" action="admin.action" method="get">
<input type="hidden" name="opttype" value="queryCustomers">
<input type="text" class="form-control me-2" name="uname" placeholder="查询...">
<button class="btn btn-primary" type="submit">搜索</button>
</form>
{% endblock %}
{% block content %}
<h1 class="page-header">会员管理</h1>
<div class="table-responsive">
<table class="table table-striped">
<thead>
<tr>
<th>会员id</th>
<th>会员名</th>
<th>操作</th>
</tr>
</thead>
<tbody>
{% for m in members %}
<tr>
<td>{{ m.uid }}</td>
<td>{{ m.uname }}</td>
<td>
<form class="d-inline" method="post" action="admin.action?opttype=deleteCustomers">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input type="hidden" name="uid" value="{{ m.uid }}">
<button class="btn btn-link p-0" type="submit"><i class="bi bi-trash" aria-hidden="true"></i>删除</button>
</form>
</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}

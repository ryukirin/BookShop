{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block head %}<link href="/BookShop/css/signin.css" rel="stylesheet">{% endblock %}
{% block body %}
<div class="container">
<form class="form-signin" name="signin" method="post" action="login.action?opttype=checkUsers">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<h2 class="form-signin-heading">请登录</h2>
<label for="inputName" class="visually-hidden">用户名</label>
<input type="text" id="inputName" name="inputName" class="form-control" placeholder="用户名" required autofocus>
<label for="inputPassword" class="visually-hidden">密码</label>
<input type="password" id="inputPassword" name="inputPassword" class="form-control" placeholder="密码" required>
<button class="btn btn-lg btn-primary w-100" type="submit">登录</button>
<button class="btn btn-lg btn-primary w-100" type="button" onclick="window.location.href='register.jsp'">注册</button>
</form>
</div>
{% endblock %}

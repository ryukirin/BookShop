{% extends "base.html" %}
{% block title %}主页{% endblock %}
{% block head %}<link href="/BookShop/css/carousel.css" rel="stylesheet">{% endblock %}
{% block body %}
<nav class="navbar navbar-expand-md navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="index.jsp">网上书店</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="切换导航"><span class="navbar-toggler-icon"></span></button>
<div id="navbar" class="collapse navbar-collapse">
<ul class="navbar-nav me-auto">
<li class="nav-item"><a class="nav-link active" aria-current="page" href="#">主页</a></li>
<li class="nav-item"><a class="nav-link" href="jsp/book.action?opttype=queryAllbook">购买</a></li>
<li class="nav-item"><a class="nav-link" href="jsp/my.action?opttype=initMypage">个人</a></li>
</ul>
{% include "_logout.html" %}
</div>
</div>
</nav>

<div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
<div class="carousel-indicators">
<button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="第 1 张"></button>
<button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1" aria-label="第 2 张"></button>
</div>
<div class="carousel-inner">
<div class="carousel-item active">
<img src="img/1.jpg" alt="First slide">
<div class="container">
<div class="carousel-caption">
<h1>最新上架</h1>
<p>我们会为您提供最优质的服务和最快捷的保障，详情请移步“购买”专区</p>
<p><a class="btn btn-lg btn-primary" href="jsp/book.action?opttype=queryAllbook" role="button">购买</a></p>
</div>
</div>
</div>
<div class="carousel-item">
<img src="img/2.jpg" alt="Second slide">
<div class="container">
<div class="carousel-caption">
<h1>销量最高</h1>
<p>畅销热榜，点击了解详情</p>
<p><a class="btn btn-lg btn-primary" href="jsp/book.action?opttype=queryAllbook" role="button">了解更多</a></p>
</div>
</div>
</div>
</div>
<button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">Previous</span></button>
<button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next"><span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">Next</span></button>
</div>
{% endblock %}
